name: Release APK

# Push a tag like v1.0.1 (after bumping versionCode/versionName in app/build.gradle.kts
# and writing release-notes.txt) and this builds the signed APK, publishes it as a
# GitHub Release, and updates docs/ota/version.json so installed apps offer the update.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Check tag matches app version
        id: ver
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          TAG="${GITHUB_REF_NAME}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "v$NAME" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $NAME in app/build.gradle.kts"; exit 1
          fi

      - name: Restore signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then echo "::error::Add the SIGNING_PASSWORD secret (Settings > Secrets and variables > Actions)"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing/release.jks.enc \
            -out "$RUNNER_TEMP/release.jks" -pass env:SIGNING_PASSWORD

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          RELEASE_KEY_ALIAS: evtube
          RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: bash gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0

      - name: Verify signature and collect APK
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee signer.txt
          grep -q "CN=Sheran Rajaguru" signer.txt || { echo "::error::APK not signed with the release key"; exit 1; }
          cp "$APK" EV-Insight-Lab-Tube.apk
          echo "sha=$(sha256sum EV-Insight-Lab-Tube.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s EV-Insight-Lab-Tube.apk)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch release-notes.txt
          gh release create "$GITHUB_REF_NAME" EV-Insight-Lab-Tube.apk \
            --title "EV Insight Lab -Tube $GITHUB_REF_NAME" \
            --notes-file release-notes.txt --latest

      - name: Update OTA manifest on main
        env:
          NAME: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
          SHA: ${{ steps.apk.outputs.sha }}
          SIZE: ${{ steps.apk.outputs.size }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 tools/write_ota.py \
            --name "$NAME" --code "$CODE" --sha256 "$SHA" --size "$SIZE" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/EV-Insight-Lab-Tube.apk" \
            --notes-file release-notes.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/ota/version.json
          git commit -m "OTA: publish v$NAME (code $CODE)" || echo "nothing to commit"
          git push origin main
